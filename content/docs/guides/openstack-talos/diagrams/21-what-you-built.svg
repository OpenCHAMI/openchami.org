<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 520" width="1320" height="520" role="img"
     aria-labelledby="t21 d21"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t21">What you built: one OpenStack project, an OpenCHAMI head, and a Talos Kubernetes cluster serving an LLM</title>
  <desc id="d21">Everything sits in one OpenStack project, ochami-lab. It has two Neutron networks, one routed and one
    deliberately silent. The head node, och-head, runs Rocky 9 and carries the OpenCHAMI control plane, an S3 store,
    an OCI registry and NAT. och-cp1 is Talos, and is the Kubernetes control plane; och-w1 and och-w2 are Talos, and
    are the Kubernetes workers. On top of the cluster, Flux drives two chains: KServe in Standard mode, then vLLM,
    serving an LLM over HTTP; and KubeRay, running a RayCluster. The result is an OpenCHAMI-provisioned Kubernetes
    cluster serving a language model over an OpenAI-compatible API, with every layer above the machines declared in
    Git.</desc>

  <defs>
    <marker id="a21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>

