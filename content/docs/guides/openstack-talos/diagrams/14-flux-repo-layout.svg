<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" width="1320" height="470" role="img"
     aria-labelledby="t14 d14"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t14">The layout of the ochami-lab-flux repository, and the two Kustomizations that order it</title>
  <desc id="d14">The Git repository Flux watches, ochami-lab-flux, has three top-level directories. clusters/ochami-lab
    holds what this cluster runs: flux-system, which bootstrap creates and which is not edited by hand, and two
    Kustomizations — infrastructure.yaml, pointing at ../../infrastructure, and apps.yaml, pointing at ../../apps
    and depending on the infrastructure one. infrastructure holds controllers, the things that add CRDs such as
    KServe and KubeRay (sections 15 and 17), and configs, the things that use those CRDs such as Gateways and
    ServingRuntimes. apps holds inference, the models actually being served (section 16). There are two
    Kustomizations rather than one because an InferenceService cannot be applied before KServe's CRDs exist, so
    apps waits on infrastructure.</desc>

  <defs>
    <marker id="a14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect width="1320" height="470" fill="#ffffff"/>

  <text x="16" y="28" font-size="17" font-weight="600" fill="#1b1f24">§14 — the Flux repository, and why it has two Kustomizations</text>
  <text x="16" y="48" font-size="12" fill="#6b7280">Grey is a file you keep and edit. Blue is Flux's own, written by bootstrap. Each column below the first is what one Kustomization applies.</text>

  <!-- repo root -->
  <rect x="16" y="68" width="1288" height="44" rx="8" fill="#f7f8fa" stroke="#d5dae0"/>
  <text x="32" y="95" font-size="15" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">ochami-lab-flux/</text>
  <text x="1288" y="95" font-size="11" text-anchor="end" fill="#4a5568">the Git repository Flux watches</text>

  <!-- ===== column 1: clusters/ochami-lab ===== -->
  <rect x="16" y="132" width="396" height="296" rx="10" fill="#f7f8fa" stroke="#d5dae0"/>
  <text x="32" y="158" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">clusters/ochami-lab/</text>
  <text x="32" y="176" font-size="10.5" fill="#4a5568">what THIS cluster runs</text>

  <rect x="32" y="192" width="364" height="60" rx="6" fill="#eef4fb" stroke="#b7cde4"/>
  <text x="48" y="216" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">flux-system/</text>
  <text x="48" y="236" font-size="10.5" fill="#4a5568">created by bootstrap; don't hand-edit</text>

  <rect x="32" y="264" width="364" height="68" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="48" y="288" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">infrastructure.yaml</text>
  <text x="48" y="308" font-size="10.5" fill="#4a5568">Kustomization → <tspan font-family="ui-monospace, Menlo, monospace">../../infrastructure</tspan></text>

  <rect x="32" y="344" width="364" height="68" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="48" y="368" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">apps.yaml</text>
  <text x="48" y="388" font-size="10.5" fill="#4a5568">Kustomization → <tspan font-family="ui-monospace, Menlo, monospace">../../apps</tspan> (depends on infra)</text>

  <!-- dependsOn: apps.yaml waits on infrastructure.yaml -->
  <path d="M396,378 H436 V298 H400" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a14)"/>

  <!-- ===== column 2: infrastructure ===== -->
  <rect x="462" y="132" width="396" height="296" rx="10" fill="#f7f8fa" stroke="#d5dae0"/>
  <text x="478" y="158" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">infrastructure/</text>
  <text x="478" y="176" font-size="10.5" fill="#4a5568">applied by <tspan font-family="ui-monospace, Menlo, monospace">infrastructure.yaml</tspan>, first</text>

  <rect x="478" y="192" width="364" height="68" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="494" y="216" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">controllers/</text>
  <text x="494" y="236" font-size="10.5" fill="#4a5568">KServe, KubeRay: things that add CRDs (§15, §17)</text>

  <rect x="478" y="272" width="364" height="68" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="494" y="296" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">configs/</text>
  <text x="494" y="316" font-size="10.5" fill="#4a5568">Gateways, ServingRuntimes: things that USE those CRDs</text>

  <!-- ===== column 3: apps ===== -->
  <rect x="908" y="132" width="396" height="296" rx="10" fill="#f7f8fa" stroke="#d5dae0"/>
  <text x="924" y="158" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">apps/</text>
  <text x="924" y="176" font-size="10.5" fill="#4a5568">applied by <tspan font-family="ui-monospace, Menlo, monospace">apps.yaml</tspan>, once infrastructure is ready</text>

  <rect x="924" y="192" width="364" height="68" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="940" y="216" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, monospace" fill="#1b1f24">inference/</text>
  <text x="940" y="236" font-size="10.5" fill="#4a5568">the actual models being served (§16)</text>

  <text x="16" y="456" font-size="10.5" fill="#b45309">Dashed: <tspan font-family="ui-monospace, Menlo, monospace">apps.yaml</tspan> <tspan font-family="ui-monospace, Menlo, monospace">dependsOn</tspan> <tspan font-family="ui-monospace, Menlo, monospace">infrastructure.yaml</tspan>, because an InferenceService cannot be applied before KServe's CRDs exist.</text>
</svg>
