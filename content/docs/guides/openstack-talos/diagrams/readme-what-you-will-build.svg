  <text x="74" y="257" font-size="11.5" font-weight="600" fill="#1b1f24">OpenCHAMI control plane <tspan font-weight="400" fill="#4a5568">— SMD, BSS, CoreSMD, …</tspan></text>
  <text x="588" y="257" font-size="11" font-weight="600" text-anchor="end" fill="#4a6d96">§7</text>

