  <rect x="40" y="420" width="1240" height="36" rx="8" fill="#fdf3e3" stroke="#e0b96a"/>
  <text x="56" y="443" font-size="13" font-weight="600" fill="#a16207"><tspan font-family="ui-monospace, Menlo, monospace">och-prov</tspan><tspan font-size="11" font-weight="400" fill="#4a5568">  — Neutron network, NO DHCP, NO router · the provisioning wire</tspan></text>
  <text x="1264" y="443" font-size="11" font-weight="600" text-anchor="end" fill="#a16207">§5</text>

  <!-- ======================= STACK ======================= -->
  <text x="16" y="508" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#4a5568">ON THE TALOS NODES — THE INFERENCE STACK, IN ORDER</text>

