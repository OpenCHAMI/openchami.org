<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" width="1320" height="610" role="img"
     aria-labelledby="trw drw"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="trw">What you will build: two Neutron networks, an OpenCHAMI head node, network-booted Talos nodes, and the inference stack on top</title>
  <desc id="drw">Everything lives in one OpenStack project, called ochami-lab throughout. There are two Neutron networks,
    both created in section 5. och-ext has DHCP on and is routed; it carries SSH and downloads. och-prov has no
    DHCP and no router; it is the provisioning wire. The head node, och-head, is a Rocky 9 instance with two ports,
    one on each network, created in section 6. Section 7 installs on it the OpenCHAMI control plane (SMD, BSS,
    CoreSMD and the rest), a Versity S3 store on port 7070 and an OCI registry on port 5000, and turns it into a
    NAT router from och-prov to och-ext. The Talos nodes — och-cp1, which becomes the Kubernetes control plane,
    and the workers och-w1 to och-wN — have one port each, on och-prov only, and network-boot Talos in sections 9
    to 12. On top of them the inference stack is built in order: Kubernetes foundations in section 13, FluxCD in
    section 14, KServe in section 15, vLLM in section 16 and KubeRay in section 17.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect width="1320" height="610" fill="#ffffff"/>

  <text x="16" y="28" font-size="17" font-weight="600" fill="#1b1f24">What you will build</text>
  <text x="16" y="48" font-size="12" fill="#6b7280">Green is routed and filtered. Amber is the silent provisioning wire. White with a dark border is a thing Nova booted. Blue is OpenCHAMI. Grey runs on the Talos nodes.</text>

